<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contracts</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 680px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
    a { color: var(--muted); font-size: 13px; text-decoration: none; }
    a:hover { color: var(--text); text-decoration: underline; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .msg { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
    .item {
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }
    .item:first-child { padding-top: 0; border-top: none; }
    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title { font-weight: 600; font-size: 14px; }
    .status {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 2px 8px;
      border-radius: 999px;
      background: #f4f4f5;
      color: #3f3f46;
    }
    .desc { font-size: 13.5px; color: #3f3f46; margin: 6px 0 4px; }
    .meta { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Contract Management</h1>
    <a href="/swagger-ui.html">Swagger UI ↗</a>
  </header>

  <section>
    <h2>New Contract</h2>
    <form id="createForm">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Optional — defaults to file name" />
      </div>
      <div class="field">
        <label for="contractDescription">Contract Description</label>
        <textarea id="contractDescription" name="contractDescription" rows="2" placeholder="Brief summary of scope, terms, or purpose"></textarea>
      </div>
      <div class="field">
        <label for="file">Document (.pdf or .docx)</label>
        <input type="file" id="file" name="file" accept=".pdf,.docx" required />
      </div>
      <button type="submit">Create Contract</button>
      <div id="msg" class="msg"></div>
    </form>
  </section>

  <section>
    <h2>Contracts</h2>
    <div id="list" class="meta">Loading...</div>
  </section>

  <script>
    const listEl = document.getElementById('list');
    const msgEl = document.getElementById('msg');
    const formEl = document.getElementById('createForm');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    async function loadContracts() {
      try {
        const res = await fetch('/api/contracts');
        const items = await res.json();
        if (!items.length) {
          listEl.innerHTML = 'No contracts yet.';
          return;
        }
        listEl.innerHTML = items.map(c => `
          <div class="item">
            <div class="item-head">
              <span class="title">#${c.id} · ${escapeHtml(c.title)}</span>
              <span class="status">${escapeHtml(c.status)}</span>
            </div>
            <div class="desc">${c.contractDescription ? escapeHtml(c.contractDescription) : '<span class="meta">No description provided</span>'}</div>
            <div class="meta">${escapeHtml(c.fileName)}</div>
          </div>
        `).join('');
      } catch {
        listEl.innerHTML = 'Could not load contracts.';
      }
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.textContent = 'Saving...';
      try {
        const res = await fetch('/api/contracts', {
          method: 'POST',
          body: new FormData(formEl)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          msgEl.textContent = data.error || 'Failed to create contract.';
          return;
        }
        formEl.reset();
        msgEl.textContent = 'Saved.';
        loadContracts();
      } catch {
        msgEl.textContent = 'Network error.';
      }
    });

    loadContracts();
  </script>
</body>
</html>
