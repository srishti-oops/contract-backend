<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contract Management</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --border: #e4e4e7;
      --accent: #18181b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 48px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 28px;
    }
    h1 { font-size: 20px; font-weight: 600; margin: 0; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
    a { color: var(--muted); font-size: 13px; text-decoration: none; }
    a:hover { color: var(--text); text-decoration: underline; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .field { margin-bottom: 14px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"],
    textarea,
    input[type="file"] {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }
    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { background: #f4f4f5; }
    .msg { font-size: 13px; color: var(--muted); margin-top: 10px; min-height: 18px; }
    .msg.error { color: #b91c1c; }
    .item {
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }
    .item:first-child { padding-top: 0; border-top: none; }
    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .title { font-weight: 600; font-size: 14.5px; }
    .status {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 3px 9px;
      border-radius: 999px;
      background: #f4f4f5;
      color: #3f3f46;
    }
    .status.REVIEW { background: #fef3c7; color: #92400e; }
    .status.APPROVED { background: #dcfce7; color: #166534; }
    .desc { font-size: 13.5px; color: #3f3f46; margin: 6px 0 4px; }
    .meta { font-size: 12px; color: var(--muted); }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .qa-box {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .qa-box input {
      padding: 7px 10px;
      font-size: 13px;
    }
    .qa-answer {
      margin-top: 8px;
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 13px;
      color: #27272a;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contract Management</h1>
    <a href="/swagger-ui.html">Swagger UI ↗</a>
  </header>

  <section>
    <h2>New Contract</h2>
    <form id="createForm">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Optional — defaults to file name" />
      </div>
      <div class="field">
        <label for="contractDescription">Contract Description</label>
        <textarea id="contractDescription" name="contractDescription" rows="2" placeholder="Brief summary of scope, terms, or purpose"></textarea>
      </div>
      <div class="field">
        <label for="file">Document (.pdf or .docx)</label>
        <input type="file" id="file" name="file" accept=".pdf,.docx" required />
      </div>
      <button type="submit">Create Contract</button>
      <div id="msg" class="msg"></div>
    </form>
  </section>

  <section>
    <h2>Contracts</h2>
    <div id="list" class="meta">Loading...</div>
  </section>

  <script>
    const listEl = document.getElementById('list');
    const msgEl = document.getElementById('msg');
    const formEl = document.getElementById('createForm');

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }

    function renderActionButton(c) {
      if (c.status === 'DRAFT') {
        return `<button type="button" onclick="advanceStatus(${c.id}, 'REVIEW')">Move to Review</button>`;
      }
      if (c.status === 'REVIEW') {
        return `<button type="button" onclick="advanceStatus(${c.id}, 'APPROVED')">Approve Contract</button>`;
      }
      return `<span class="meta">Workflow complete (Approved)</span>`;
    }

    async function advanceStatus(id, nextStatus) {
      const statusMsg = document.getElementById(`status-msg-${id}`);
      if (statusMsg) {
        statusMsg.className = 'meta';
        statusMsg.textContent = `Updating to ${nextStatus}...`;
      }
      try {
        const res = await fetch(`/api/contracts/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: nextStatus })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (statusMsg) {
            statusMsg.className = 'msg error';
            statusMsg.textContent = data.error || 'Failed to update status.';
          }
          return;
        }
        await loadContracts();
      } catch {
        if (statusMsg) {
          statusMsg.className = 'msg error';
          statusMsg.textContent = 'Network error while updating status.';
        }
      }
    }

    async function askContract(id) {
      const input = document.getElementById(`qa-input-${id}`);
      const answerBox = document.getElementById(`qa-answer-${id}`);
      const question = input.value.trim();
      if (!question) return;

      answerBox.style.display = 'block';
      answerBox.textContent = 'Searching contract...';

      try {
        const res = await fetch(`/api/contracts/${id}/ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          answerBox.textContent = data.error || 'Could not answer question.';
          return;
        }
        const excerpts = Array.isArray(data.matchingExcerpts) && data.matchingExcerpts.length
          ? '\n\nExcerpts:\n• ' + data.matchingExcerpts.join('\n• ')
          : '';
        answerBox.style.whiteSpace = 'pre-wrap';
        answerBox.textContent = (data.answer || 'No answer returned.') + excerpts;
      } catch {
        answerBox.textContent = 'Network error.';
      }
    }

    async function loadContracts() {
      try {
        const res = await fetch('/api/contracts');
        const items = await res.json();
        if (!items.length) {
          listEl.innerHTML = 'No contracts yet.';
          return;
        }
        listEl.innerHTML = items.map(c => `
          <div class="item">
            <div class="item-head">
              <span class="title">#${c.id} · ${escapeHtml(c.title)}</span>
              <span class="status ${escapeHtml(c.status)}">${escapeHtml(c.status)}</span>
            </div>
            <div class="desc">${c.contractDescription ? escapeHtml(c.contractDescription) : '<span class="meta">No description provided</span>'}</div>
            <div class="meta">File: ${escapeHtml(c.fileName)}</div>
            <div class="actions">
              ${renderActionButton(c)}
              <span id="status-msg-${c.id}" class="meta"></span>
            </div>
            <div class="qa-box">
              <input type="text" id="qa-input-${c.id}" placeholder="Ask a question about this contract..." />
              <button type="button" class="secondary" onclick="askContract(${c.id})">Ask</button>
            </div>
            <div id="qa-answer-${c.id}" class="qa-answer"></div>
          </div>
        `).join('');
      } catch {
        listEl.innerHTML = 'Could not load contracts.';
      }
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.className = 'msg';
      msgEl.textContent = 'Saving...';
      try {
        const res = await fetch('/api/contracts', {
          method: 'POST',
          body: new FormData(formEl)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          msgEl.className = 'msg error';
          msgEl.textContent = data.error || 'Failed to create contract.';
          return;
        }
        formEl.reset();
        msgEl.textContent = 'Saved.';
        loadContracts();
      } catch {
        msgEl.className = 'msg error';
        msgEl.textContent = 'Network error.';
      }
    });

    loadContracts();
  </script>
</body>
</html>
